
name: Update Good News

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect news
        run: python news.py

      - name: Save news
        run: |
          git config user.name "News Bot"
          git config user.email "actions@github.com"
          git add feed.json
          git diff --cached --quiet || (
            git commit -m "Update news feed" &&
            git push
          )
