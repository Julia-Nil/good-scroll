
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Good News</title>
<style>
body {
  font-family: system-ui, sans-serif;
  background: #f5f6f3;
  color: #26332d;
  max-width: 650px;
  margin: auto;
  padding: 24px 18px;
}
header {
  padding: 25px 0;
  border-bottom: 1px solid #ddd;
}
h1 { margin-bottom: 5px; }
.subtitle { color: #68776e; }
.story {
  background: white;
  padding: 18px;
  margin: 16px 0;
  border-radius: 12px;
}
.category {
  color: #38815c;
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
}
a { color: #286b4a; }
footer {
  color: #829087;
  font-size: 12px;
  margin-top: 35px;
}
</style>
</head>
<body>
<header>
  <div class="subtitle">YOUR PERSONAL NEWSPAPER</div>
  <h1>🌱 Good News</h1>
  <div class="subtitle">Interesting things happening in the world.</div>
</header>

<main id="feed">
  <div class="story">
    <div class="category">Welcome</div>
    <h2>Your newspaper is under construction!</h2>
    <p>Soon, this space will fill with interesting,
    encouraging stories from around the world.</p>
  </div>
</main>

<footer>
  Independently curated · Made for curious minds
</footer>
</body>
</html>
